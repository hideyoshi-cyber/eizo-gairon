<svg class="fig-ladder" viewBox="0 0 560 580" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ladder-title ladder-desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="ladder-title">抽象から形容詞、具体、パラメータへのはしご</title>
  <desc id="ladder-desc">制作では抽象からパラメータへ降ろし、分析ではパラメータから抽象へたどる。4段は、抽象（自分の中の核）、形容詞（チームとの共通言語）、具体（コンテと演出の指示）、パラメータ（スタッフの作業指示）。</desc>
  <style>
    .fig-ladder .box{fill:var(--panel,#FFFFFF);stroke:var(--rule,#D3D7DE);stroke-width:1.5}
    .fig-ladder .bar{fill:var(--ink,#1A1D24)}
    .fig-ladder .step{fill:var(--ink,#1A1D24);font:700 19px "Zen Kaku Gothic New","Hiragino Sans",sans-serif}
    .fig-ladder .who{fill:var(--sub,#5B616E);font:500 13px "Zen Kaku Gothic New","Hiragino Sans",sans-serif}
    .fig-ladder .ex{fill:var(--ink,#1A1D24);font:500 15px "Zen Kaku Gothic New","Hiragino Sans",sans-serif}
    .fig-ladder .down{stroke:var(--c20,#127F91);stroke-width:4;fill:none}
    .fig-ladder .downh{fill:var(--c20,#127F91)}
    .fig-ladder .up{stroke:var(--c00,#B0347E);stroke-width:4;fill:none}
    .fig-ladder .uph{fill:var(--c00,#B0347E)}
    .fig-ladder .lab{font:700 15px "Zen Kaku Gothic New","Hiragino Sans",sans-serif;writing-mode:vertical-rl;letter-spacing:.15em}
    .fig-ladder .lab-d{fill:var(--c20,#127F91)}
    .fig-ladder .lab-u{fill:var(--c00,#B0347E)}
  </style>

  <!-- 制作：降ろす（左） -->
  <line class="down" x1="34" y1="24" x2="34" y2="540"/>
  <polygon class="downh" points="22,536 46,536 34,560"/>
  <text class="lab lab-d" x="58" y="200">制作｜抽象から降ろす</text>

  <!-- 分析：たどる（右） -->
  <line class="up" x1="526" y1="556" x2="526" y2="40"/>
  <polygon class="uph" points="514,44 538,44 526,20"/>
  <text class="lab lab-u" x="502" y="200">分析｜作品からたどる</text>

  <!-- 1 抽象 -->
  <rect class="box" x="84" y="20" width="392" height="116" rx="10"/>
  <rect class="bar" x="84" y="20" width="8" height="116" rx="4"/>
  <text class="step" x="108" y="52">1　抽象</text>
  <text class="who" x="108" y="74">自分の中の核</text>
  <text class="ex" x="108" y="112">「取り返しのつかない喪失」</text>

  <!-- 2 形容詞 -->
  <rect class="box" x="84" y="158" width="392" height="116" rx="10"/>
  <rect class="bar" x="84" y="158" width="8" height="116" rx="4"/>
  <text class="step" x="108" y="190">2　形容詞</text>
  <text class="who" x="108" y="212">監督・チームとの共通言語</text>
  <text class="ex" x="108" y="250">冷たい／静か／遠い</text>

  <!-- 3 具体 -->
  <rect class="box" x="84" y="296" width="392" height="116" rx="10"/>
  <rect class="bar" x="84" y="296" width="8" height="116" rx="4"/>
  <text class="step" x="108" y="328">3　具体</text>
  <text class="who" x="108" y="350">コンテ・演出の指示</text>
  <text class="ex" x="108" y="382">夕方の逆光、人物は画面の端、</text>
  <text class="ex" x="108" y="402">音楽は入れない</text>

  <!-- 4 パラメータ -->
  <rect class="box" x="84" y="434" width="392" height="126" rx="10"/>
  <rect class="bar" x="84" y="434" width="8" height="126" rx="4"/>
  <text class="step" x="108" y="466">4　パラメータ</text>
  <text class="who" x="108" y="488">各スタッフの作業指示</text>
  <text class="ex" x="108" y="520">色温度：寒色寄り／彩度：下げる</text>
  <text class="ex" x="108" y="542">人物：画面の端3分の1／カット尺：長め</text>
</svg>
