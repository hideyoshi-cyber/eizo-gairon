    .fig-l28d .mm{fill:var(--c10,#5C6BC0);opacity:.55}
    .fig-l28d .ms{stroke:var(--c10,#5C6BC0);fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
