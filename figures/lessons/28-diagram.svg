<svg class="fig-l28d" viewBox="0 0 560 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="l28d-t l28d-d">
  <title id="l28d-t">色の源流をたどる『ラ・ラ・ランド』と『シェルブールの雨傘』の考察</title>
  <desc id="l28d-d">源流から「色と歌の一体感」を引き継ぎ、舞台を「現実の街」に置き換えた。</desc>
  <style>
    .fig-l28d .bg{fill:var(--panel,#FFFFFF)}
