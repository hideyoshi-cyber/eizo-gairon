<rect class="box" x="20" y="16" width="520" height="94" rx="10"/><rect class="m" x="20" y="16" width="10" height="94" rx="4"/><text class="step" x="48" y="46">源流　『シェルブールの雨傘』</text><text class="ex" x="48" y="70">1960年代のフランスのミュージカル</text><text class="ex" x="48" y="92">新しく見える作品も、過去への敬意から作られる</text><line class="arrow" x1="280" y1="112" x2="280" y2="126"/><polygon class="head" points="272,124 288,124 280,134"/><rect class="box" x="20" y="138" width="254" height="116" rx="10"/><rect class="m" x="20" y="138" width="10" height="116" rx="4"/><text class="step" x="48" y="168">引き継いだもの</text><text class="ex" x="48" y="192">色と歌の一体感</text><text class="ex" x="48" y="214">原色の壁や衣装</text><text class="ex" x="48" y="236">歌で気持ちを語る演出</text><rect class="box" x="286" y="138" width="254" height="116" rx="10"/><rect class="m" x="286" y="138" width="10" height="116" rx="4"/><text class="step" x="314" y="168">変えたもの</text><text class="ex" x="314" y="192">現実の街</text><text class="ex" x="314" y="214">フランスの港町から</text><text class="ex" x="314" y="236">ロサンゼルスへ</text><rect class="box" x="20" y="266" width="520" height="94" rx="10"/><rect class="m" x="20" y="266" width="10" height="94" rx="4"/><text class="step" x="48" y="296">源流は、古いほど自由に引用できる</text><text class="ex" x="48" y="320">古い作品を知っていることは、大きな武器</text><text class="ex" x="48" y="342">2年間で90年代まで遡るのは、そのため</text>
</svg>
