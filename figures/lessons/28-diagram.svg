    .fig-l28d .a10{fill:var(--c10,#5C6BC0);opacity:.85}
    .fig-l28d .a20{fill:var(--c20,#127F91);opacity:.85}
    .fig-l28d .a00{fill:var(--c00,#B0347E);opacity:.85}
    .fig-l28d .a90{fill:var(--c90,#C26A1B);opacity:.85}
    .fig-l28d .t{fill:var(--ink,#1A1D24);font:700 19px "Zen Kaku Gothic New","Hiragino Sans",sans-serif}
    .fig-l28d .box{fill:var(--panel,#FFFFFF);stroke:var(--rule,#D3D7DE);stroke-width:1.5}
