<svg class="fig-l59i" viewBox="0 0 560 315" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="l59i-t l59i-d">
  <title id="l59i-t">波紋を読んで次の石を選ぶ図案</title>
  <desc id="l59i-d">同心の楕円の波紋が広がり、中心に石の点がある。右上には、次に投げる石の位置が点線の輪で示される。講評で波紋を読み、次の石を選ぶことを抽象的に表す。</desc>
