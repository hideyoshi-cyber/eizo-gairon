    .fig-l59i .gl{stroke:var(--rule,#D3D7DE);stroke-width:1;fill:none}
    .fig-l59i .a{fill:var(--c90,#C26A1B)}
    .fig-l59i .as{stroke:var(--c90,#C26A1B);stroke-width:2.5;fill:none}
    .fig-l59i .k{fill:var(--ink,#1A1D24)}
    .fig-l59i .ks{stroke:var(--ink,#1A1D24);stroke-width:2;fill:none}
    .fig-l59i .ss{stroke:var(--sub,#5B616E);stroke-width:1.5;fill:none}
    .fig-l59i .p{fill:var(--paper,#F4F5F7)}
    .fig-l59i .pn{fill:var(--panel,#FFFFFF)}
    .fig-l59i .d{stroke-dasharray:6 5}
  </style>
