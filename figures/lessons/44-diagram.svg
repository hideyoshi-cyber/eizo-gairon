<svg class="fig-l44d" viewBox="0 0 560 402" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="l44d-t l44d-d">
  <title id="l44d-t">ゲーム機の世代を読む：3つの考察</title>
  <desc id="l44d-d">PlayStationの『FF7』はプリレンダの背景、PS2の『FFX』は声が入り立体的なフィールドへ、PS3の『MGS4』は長いムービー。ゲーム機が変わるたびに作れる画が変わった。</desc>
  <style>
    .fig-l44d .box{fill:var(--panel,#FFFFFF);stroke:var(--rule,#D3D7DE);stroke-width:1.5}
    .fig-l44d .step{fill:var(--ink,#1A1D24);font:700 19px "Zen Kaku Gothic New","Hiragino Sans",sans-serif}
    .fig-l44d .ex{fill:var(--ink,#1A1D24);font:500 14.5px "Zen Kaku Gothic New","Hiragino Sans",sans-serif}
    .fig-l44d .who{fill:var(--sub,#5B616E);font:500 12.5px "Zen Kaku Gothic New","Hiragino Sans",sans-serif}
    .fig-l44d .mid{text-anchor:middle}
    .fig-l44d .arrow{stroke:var(--sub,#5B616E);stroke-width:3;fill:none}
    .fig-l44d .head{fill:var(--sub,#5B616E)}
    .fig-l44d .bar{fill:var(--c00,#B0347E)}
    .fig-l44d .accbox{fill:var(--panel,#FFFFFF);stroke:var(--c00,#B0347E);stroke-width:2.5}
    .fig-l44d .accfill{fill:var(--c00,#B0347E)}
    .fig-l44d .accline{stroke:var(--c00,#B0347E);stroke-width:3;fill:none}
    .fig-l44d .rule{stroke:var(--rule,#D3D7DE);stroke-width:1.5;fill:none}
    .fig-l44d .inkfill{fill:var(--ink,#1A1D24)}
    .fig-l44d .paper{fill:var(--paper,#FFFFFF)}
    .fig-l44d .panel{fill:var(--panel,#FFFFFF)}
    .fig-l44d .ink{stroke:var(--ink,#1A1D24);stroke-width:2;fill:none}
    .fig-l44d .sub{stroke:var(--sub,#5B616E);stroke-width:2;fill:none}
  </style>
  <rect class="box" x="20" y="16" width="170" height="80" rx="10"/>
  <rect class="bar" x="20" y="16" width="10" height="80" rx="4"/>
  <text class="step" x="46" y="52">PlayStation</text>
  <text class="who" x="46" y="76">第1回『FF7』</text>
  <line class="accline" x1="190" y1="56" x2="214" y2="56"/>
  <rect class="box" x="216" y="16" width="324" height="80" rx="10"/>
  <text class="ex" x="236" y="62">プリレンダの背景</text>
  <line class="arrow" x1="105" y1="100" x2="105" y2="108"/><polygon class="head" points="97,106 113,106 105,116"/>
  <rect class="box" x="20" y="120" width="170" height="80" rx="10"/>
  <rect class="bar" x="20" y="120" width="10" height="80" rx="4"/>
  <text class="step" x="46" y="156">PS2</text>
  <text class="who" x="46" y="180">『FFX』</text>
  <line class="accline" x1="190" y1="160" x2="214" y2="160"/>
  <rect class="box" x="216" y="120" width="324" height="80" rx="10"/>
  <text class="ex" x="236" y="154">登場人物が声を持つ</text>
  <text class="ex" x="236" y="180">立体的なフィールドへ移る</text>
  <line class="arrow" x1="105" y1="204" x2="105" y2="212"/><polygon class="head" points="97,210 113,210 105,220"/>
  <rect class="box" x="20" y="224" width="170" height="80" rx="10"/>
  <rect class="bar" x="20" y="224" width="10" height="80" rx="4"/>
  <text class="step" x="46" y="260">PS3</text>
  <text class="who" x="46" y="284">『MGS4』</text>
  <line class="accline" x1="190" y1="264" x2="214" y2="264"/>
  <rect class="box" x="216" y="224" width="324" height="80" rx="10"/>
  <text class="ex" x="236" y="258">長いムービーシーンで物語を語る</text>
  <text class="ex" x="236" y="284">カメラの主導権を作り手が握る</text>
  <line class="arrow" x1="105" y1="300" x2="105" y2="314"/><polygon class="head" points="97,312 113,312 105,322"/>
  <rect class="accbox" x="20" y="326" width="520" height="60" rx="10"/>
  <text class="step" x="40" y="362">ハードが変わるたびに、作れる画が変わる</text>
</svg>
