<svg class="fig-l01d" viewBox="0 0 560 554" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="l01d-t l01d-d">
  <title id="l01d-t">27年の比較から言えること</title>
  <desc id="l01d-d">レイヤー構造は工程の分業から1つのエンジンへ。映画のように語る設計思想は変わらず、技術の選択は制約から決まり、源流は人でたどれる。</desc>
  <style>
    .fig-l01d .box{fill:var(--panel,#FFFFFF);stroke:var(--rule,#D3D7DE);stroke-width:1.5}
    .fig-l01d .step{fill:var(--ink,#1A1D24);font:700 19px "Zen Kaku Gothic New","Hiragino Sans",sans-serif}
    .fig-l01d .ex{fill:var(--ink,#1A1D24);font:500 14.5px "Zen Kaku Gothic New","Hiragino Sans",sans-serif}
    .fig-l01d .who{fill:var(--sub,#5B616E);font:500 12.5px "Zen Kaku Gothic New","Hiragino Sans",sans-serif}
    .fig-l01d .arrow{stroke:var(--sub,#5B616E);stroke-width:3;fill:none}
    .fig-l01d .head{fill:var(--sub,#5B616E)}
    .fig-l01d .a{fill:var(--c20,#127F91)} .fig-l01d .b{fill:var(--c10,#5C6BC0)} .fig-l01d .c{fill:var(--c00,#B0347E)} .fig-l01d .d{fill:var(--c90,#C26A1B)}
    .fig-l01d .mid{text-anchor:middle}
    .fig-l01d .inv{fill:var(--paper,#F5F3EE)}
  </style>
  <rect class="a" x="20" y="56" width="250" height="34" rx="6" opacity="0.95"/>
  <text class="ex inv" x="34" y="78">プリレンダ背景</text>
  <rect class="a" x="20" y="100" width="250" height="34" rx="6" opacity="0.7"/>
  <text class="ex" x="34" y="122">3Dキャラクター</text>
  <rect class="a" x="20" y="144" width="250" height="34" rx="6" opacity="0.45"/>
  <text class="ex" x="34" y="166">CGムービー</text>
  <text class="who" x="278" y="111">継ぎ目</text>
  <text class="step" x="20" y="40">1997年：別々の層</text>
  <text class="step" x="300" y="40">2024年：1つのエンジン</text>
  <rect class="box" x="300" y="56" width="240" height="122" rx="10"/><rect class="a" x="300" y="56" width="10" height="122" rx="4"/>
  <text class="ex" x="326" y="100">ほぼすべてリアルタイム</text>
  <text class="ex" x="326" y="124">継ぎ目そのものが消えた</text>
  <text class="who" x="326" y="154">分業から1つのエンジンへ</text>
  <rect class="box" x="20" y="194" width="520" height="114" rx="10"/>
  <rect class="b" x="20" y="194" width="10" height="114" rx="4"/>
  <text class="step" x="48" y="226">変わらない設計思想</text>
  <text class="ex" x="48" y="254">映画のように語る：北瀬の映画的な語り</text>
  <text class="ex" x="48" y="276">場面に寄り添う音楽の考え方</text>
  <text class="who" x="48" y="298">画質の差より、この変わらない部分を読む</text>
  <rect class="box" x="20" y="320" width="520" height="114" rx="10"/>
  <rect class="c" x="20" y="320" width="10" height="114" rx="4"/>
  <text class="step" x="48" y="352">技術の選択は制約から</text>
  <text class="ex" x="48" y="380">1997年：容量という制約でPlayStation</text>
  <text class="ex" x="48" y="402">2024年：開発期間という制約でUE4継続</text>
  <text class="who" x="48" y="424">作りたいものを期限内に届けるための選択</text>
  <rect class="box" x="20" y="446" width="520" height="92" rx="10"/>
  <rect class="d" x="20" y="446" width="10" height="92" rx="4"/>
  <text class="step" x="48" y="478">源流は人でたどれる</text>
  <text class="ex" x="48" y="506">同じ作り手が、27年後に役割を変えて戻った</text>
  <text class="who" x="48" y="528">作品名だけでなく、作り手が経てきたことを調べる</text>

</svg>
