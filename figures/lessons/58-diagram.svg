<svg class="fig-l58d" viewBox="0 0 560 516" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="l58d-t l58d-d">
  <title id="l58d-t">観る側と作る側が入れ替わる要点</title>
  <desc id="l58d-d">考察の3点。作り手として観られる。観客の反応を見る。他人の作品を分析シートで読む。</desc>
  <style>
    .fig-l58d .box{fill:var(--panel,#FFFFFF);stroke:var(--rule,#D3D7DE);stroke-width:1.5}
    .fig-l58d .bar{fill:var(--c90,#C26A1B)}
    .fig-l58d .step{fill:var(--ink,#1A1D24);font:700 19px "Zen Kaku Gothic New","Hiragino Sans",sans-serif}
    .fig-l58d .ex{fill:var(--ink,#1A1D24);font:500 14.5px "Zen Kaku Gothic New","Hiragino Sans",sans-serif}
    .fig-l58d .ex2{fill:var(--ink,#1A1D24);font:700 15px "Zen Kaku Gothic New","Hiragino Sans",sans-serif}
    .fig-l58d .who{fill:var(--sub,#5B616E);font:500 12.5px "Zen Kaku Gothic New","Hiragino Sans",sans-serif}
    .fig-l58d .sm{fill:var(--ink,#1A1D24);font:500 12.5px "Zen Kaku Gothic New","Hiragino Sans",sans-serif}
    .fig-l58d .chip{fill:var(--paper,#F4F5F7);stroke:var(--c90,#C26A1B);stroke-width:1.5}
    .fig-l58d .chipd{fill:none;stroke:var(--sub,#5B616E);stroke-width:1.5;stroke-dasharray:5 4}
    .fig-l58d .arrow{stroke:var(--c90,#C26A1B);stroke-width:3;fill:none}
    .fig-l58d .head{fill:var(--c90,#C26A1B)}
  </style>
  <rect class="box" x="20" y="16" width="520" height="162" rx="10"/><rect class="bar" x="20" y="16" width="10" height="162" rx="4"/><text class="step" x="48" y="48">1　作り手として観られる</text>
  <rect class="chip" x="36" y="64" width="228" height="72" rx="8"/>
  <text class="ex2" x="150" y="85" text-anchor="middle">2年間</text>
  <text class="ex" x="150" y="105" text-anchor="middle">他人の作品を</text>
  <text class="ex" x="150" y="125" text-anchor="middle">分析シートで読んだ</text>
  <rect class="chip" x="296" y="64" width="228" height="72" rx="8"/>
  <text class="ex2" x="410" y="85" text-anchor="middle">今日</text>
  <text class="ex" x="410" y="105" text-anchor="middle">自分の作品が</text>
  <text class="ex" x="410" y="125" text-anchor="middle">読まれる側になる</text>
  <line class="arrow" x1="268" y1="100" x2="286" y2="100"/><polygon class="head" points="294,100 284,94 284,106"/>
  <text class="who" x="48" y="158">「観る側」と「作る側」が入れ替わる日</text>
  <rect class="box" x="20" y="190" width="520" height="168" rx="10"/><rect class="bar" x="20" y="190" width="10" height="168" rx="4"/><text class="step" x="48" y="222">2　観客の反応を見る</text>
  <rect class="chip" x="36" y="238" width="116" height="56" rx="8"/>
  <text class="ex" x="94" y="261" text-anchor="middle">笑った</text>
  <text class="ex" x="94" y="281" text-anchor="middle">ところ</text>
  <rect class="chip" x="162" y="238" width="116" height="56" rx="8"/>
  <text class="ex" x="220" y="261" text-anchor="middle">息をのんだ</text>
  <text class="ex" x="220" y="281" text-anchor="middle">ところ</text>
  <rect class="chip" x="288" y="238" width="116" height="56" rx="8"/>
  <text class="ex" x="346" y="261" text-anchor="middle">退屈そうだった</text>
  <text class="ex" x="346" y="281" text-anchor="middle">ところ</text>
  <line class="arrow" x1="404" y1="266" x2="424" y2="266"/><polygon class="head" points="432,266 422,260 422,272"/>
  <rect class="chip" x="436" y="238" width="88" height="56" rx="8"/>
  <text class="ex" x="480" y="261" text-anchor="middle">それが</text>
  <text class="ex" x="480" y="281" text-anchor="middle">波紋</text>
  <text class="who" x="48" y="320">画面だけでなく、観ている人の反応も見る</text>
  <rect class="box" x="20" y="370" width="520" height="130" rx="10"/><rect class="bar" x="20" y="370" width="10" height="130" rx="4"/><text class="step" x="48" y="402">3　他人の作品を読む</text>
  <rect class="chip" x="36" y="418" width="228" height="44" rx="8"/>
  <text class="ex" x="150" y="435" text-anchor="middle">同じ課題を</text>
  <text class="ex" x="150" y="455" text-anchor="middle">同じ時間で作った作品</text>
  <rect class="chip" x="296" y="418" width="228" height="44" rx="8"/>
  <text class="ex" x="410" y="435" text-anchor="middle">判断の違いが</text>
  <text class="ex" x="410" y="455" text-anchor="middle">よく見える</text>
  <line class="arrow" x1="268" y1="440" x2="286" y2="440"/><polygon class="head" points="294,440 284,434 284,446"/>
  <text class="who" x="48" y="482">宿題：他の人の作品を分析シートで読む</text>
</svg>
