  <line class="rule" x1="410" y1="126" x2="410" y2="144" style="stroke-dasharray:3 4"/>
  <polygon style="fill:var(--c00,#B0347E);fill-opacity:0.5" points="180,144 410,144 380,178 150,178"/>
