<svg class="fig-l42i" viewBox="0 0 560 315" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="l42i-t l42i-d">
  <title id="l42i-t">1カットを層に分ける</title>
  <desc id="l42i-d">平行四辺形の板が5枚、少しずつ間隔をあけて縦に重なる。1枚の画を層に分解するイメージ。</desc>
  <style>
    .fig-l42i .box{fill:var(--panel,#FFFFFF);stroke:var(--rule,#D3D7DE);stroke-width:1.5}
    .fig-l42i .step{fill:var(--ink,#1A1D24);font:700 19px "Zen Kaku Gothic New","Hiragino Sans",sans-serif}
    .fig-l42i .ex{fill:var(--ink,#1A1D24);font:500 14.5px "Zen Kaku Gothic New","Hiragino Sans",sans-serif}
    .fig-l42i .who{fill:var(--sub,#5B616E);font:500 12.5px "Zen Kaku Gothic New","Hiragino Sans",sans-serif}
    .fig-l42i .mid{text-anchor:middle}
    .fig-l42i .arrow{stroke:var(--sub,#5B616E);stroke-width:3;fill:none}
    .fig-l42i .head{fill:var(--sub,#5B616E)}
    .fig-l42i .bar{fill:var(--c00,#B0347E)}
    .fig-l42i .accbox{fill:var(--panel,#FFFFFF);stroke:var(--c00,#B0347E);stroke-width:2.5}
    .fig-l42i .accfill{fill:var(--c00,#B0347E)}
    .fig-l42i .accline{stroke:var(--c00,#B0347E);stroke-width:3;fill:none}
    .fig-l42i .rule{stroke:var(--rule,#D3D7DE);stroke-width:1.5;fill:none}
    .fig-l42i .inkfill{fill:var(--ink,#1A1D24)}
    .fig-l42i .paper{fill:var(--paper,#FFFFFF)}
    .fig-l42i .panel{fill:var(--panel,#FFFFFF)}
    .fig-l42i .ink{stroke:var(--ink,#1A1D24);stroke-width:2;fill:none}
    .fig-l42i .sub{stroke:var(--sub,#5B616E);stroke-width:2;fill:none}
  </style>
  <rect class="panel" x="0" y="0" width="560" height="315"/>
