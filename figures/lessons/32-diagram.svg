    .fig-l32d .head{fill:var(--sub,#5B616E)}
    .fig-l32d .band{fill:var(--c00,#B0347E);fill-opacity:.16;stroke:var(--c00,#B0347E);stroke-width:1.5}
    .fig-l32d .bt{fill:var(--ink,#1A1D24);font:700 16px "Zen Kaku Gothic New","Hiragino Sans",sans-serif}
    .fig-l32d .fl{fill:var(--ink,#1A1D24);font:700 15px "Zen Kaku Gothic New","Hiragino Sans",sans-serif}
  </style>
<rect class="band" x="20" y="16" width="520" height="48" rx="10"/><text class="bt" x="36" y="46">湯屋という「職場」のルールでできている</text><rect class="box" x="20" y="76" width="520" height="116" rx="10"/><rect class="m" x="20" y="76" width="10" height="116" rx="4"/><text class="step" x="48" y="106">1　ルールは「社会」から作れる</text><text class="who" x="48" y="130">第13回『マイ・エレメント』：元素の性質から</text><text class="ex" x="48" y="152">この作品：職場という社会の仕組みから</text><text class="ex" x="48" y="174">世界観の作り方には、いくつも入口がある</text><rect class="box" x="20" y="204" width="520" height="116" rx="10"/><rect class="m" x="20" y="204" width="10" height="116" rx="4"/><text class="step" x="48" y="234">2　ルールが主人公を試す</text><text class="ex" x="48" y="258">「働かないと存在できない」というルール</text><text class="ex" x="48" y="280">主人公は、働くしかない</text><text class="ex" x="48" y="302">世界のルールが、成長の舞台になる</text><rect class="box" x="20" y="332" width="520" height="116" rx="10"/><rect class="m" x="20" y="332" width="10" height="116" rx="4"/><text class="step" x="48" y="362">3　設定は画で見せる</text><text class="ex" x="48" y="386">ルールは、ほとんど説明されない</text><text class="ex" x="48" y="408">働く人の動き、帳場、契約書の場面で見せる</text><text class="ex" x="48" y="430">設定書は、チームのために書くもの</text>
</svg>
