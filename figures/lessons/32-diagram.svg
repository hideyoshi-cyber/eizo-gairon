<svg class="fig-l32d" viewBox="0 0 560 468" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="l32d-t l32d-d">
  <title id="l32d-t">働く場所が世界になる『千と千尋の神隠し』の世界観設定の考察</title>
  <desc id="l32d-d">ルールは社会から作れ、主人公を試し、画で見せる。</desc>
  <style>
    .fig-l32d .bg{fill:var(--panel,#FFFFFF)}
    .fig-l32d .k{fill:var(--ink,#1A1D24)}
    .fig-l32d .ko{fill:var(--ink,#1A1D24);opacity:.1}
    .fig-l32d .s{fill:var(--sub,#5B616E)}
    .fig-l32d .rs{stroke:var(--rule,#D3D7DE);fill:none;stroke-width:1.5}
    .fig-l32d .m{fill:var(--c00,#B0347E)}
    .fig-l32d .mo{fill:var(--c00,#B0347E);opacity:.22}
    .fig-l32d .mm{fill:var(--c00,#B0347E);opacity:.55}
    .fig-l32d .ms{stroke:var(--c00,#B0347E);fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
    .fig-l32d .ms2{stroke:var(--c00,#B0347E);fill:none;stroke-width:2.5;stroke-linecap:round}
    .fig-l32d .ks{stroke:var(--ink,#1A1D24);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
    .fig-l32d .ks2{stroke:var(--ink,#1A1D24);fill:none;stroke-width:2;opacity:.5}
    .fig-l32d .dash{stroke:var(--sub,#5B616E);fill:none;stroke-width:2.5;stroke-dasharray:6 6;stroke-linecap:round}
    .fig-l32d .card{fill:var(--panel,#FFFFFF);stroke:var(--c00,#B0347E);stroke-width:4}
    .fig-l32d .a10{fill:var(--c10,#5C6BC0);opacity:.85}
    .fig-l32d .a20{fill:var(--c20,#127F91);opacity:.85}
    .fig-l32d .a00{fill:var(--c00,#B0347E);opacity:.85}
    .fig-l32d .a90{fill:var(--c90,#C26A1B);opacity:.85}
    .fig-l32d .t{fill:var(--ink,#1A1D24);font:700 19px "Zen Kaku Gothic New","Hiragino Sans",sans-serif}
    .fig-l32d .box{fill:var(--panel,#FFFFFF);stroke:var(--rule,#D3D7DE);stroke-width:1.5}
    .fig-l32d .step{fill:var(--ink,#1A1D24);font:700 19px "Zen Kaku Gothic New","Hiragino Sans",sans-serif}
