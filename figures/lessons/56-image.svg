  <title id="l56i-t">はしごの下を一瞬で埋める図案</title>
  <desc id="l56i-d">4本の横木のはしご。一番下は小さな四角が一瞬で埋まり、一番上は点だけが輪の中にある。AIが下の段を埋め、上の段は人が決めることを抽象的に表す。</desc>
