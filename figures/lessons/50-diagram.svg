<svg class="fig-l50d" viewBox="0 0 560 530" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="l50d-t l50d-d">
  <title id="l50d-t">技術の限界から企画を選ぶ</title>
  <desc id="l50d-d">考察の3点。当時のCGは柔らかいものや肌が苦手で、硬いおもちゃは相性がよい題材だった。自主制作でも限界の中で一番輝く題材を選ぶ。技術の限界が広がると、選べる題材も広がる。</desc>
  <style>
    .fig-l50d .box{fill:var(--panel,#FFFFFF);stroke:var(--rule,#D3D7DE);stroke-width:1.5}
    .fig-l50d .bar{fill:var(--c90,#C26A1B)}
    .fig-l50d .step{fill:var(--ink,#1A1D24);font:700 19px "Zen Kaku Gothic New","Hiragino Sans",sans-serif}
    .fig-l50d .ex{fill:var(--ink,#1A1D24);font:500 14.5px "Zen Kaku Gothic New","Hiragino Sans",sans-serif}
    .fig-l50d .ex2{fill:var(--ink,#1A1D24);font:700 15px "Zen Kaku Gothic New","Hiragino Sans",sans-serif}
    .fig-l50d .who{fill:var(--sub,#5B616E);font:500 12.5px "Zen Kaku Gothic New","Hiragino Sans",sans-serif}
    .fig-l50d .sm{fill:var(--ink,#1A1D24);font:500 12.5px "Zen Kaku Gothic New","Hiragino Sans",sans-serif}
    .fig-l50d .chip{fill:var(--paper,#F4F5F7);stroke:var(--c90,#C26A1B);stroke-width:1.5}
    .fig-l50d .chipd{fill:none;stroke:var(--sub,#5B616E);stroke-width:1.5;stroke-dasharray:5 4}
    .fig-l50d .arrow{stroke:var(--c90,#C26A1B);stroke-width:3;fill:none}
    .fig-l50d .head{fill:var(--c90,#C26A1B)}
  </style>
  <rect class="box" x="20" y="16" width="520" height="146" rx="10"/><rect class="bar" x="20" y="16" width="10" height="146" rx="4"/><text class="step" x="48" y="48">1　限界の中で一番輝く題材を選ぶ</text>
  <rect class="chip" x="36" y="64" width="228" height="60" rx="8"/>
  <text class="ex2" x="150" y="89" text-anchor="middle">当時のCGが苦手なもの</text>
  <text class="ex" x="150" y="109" text-anchor="middle">柔らかいもの、毛、人の肌</text>
  <rect class="chip" x="296" y="64" width="228" height="60" rx="8"/>
  <text class="ex2" x="410" y="89" text-anchor="middle">選んだ題材</text>
  <text class="ex" x="410" y="109" text-anchor="middle">つるつるした硬いおもちゃ</text>
  <line class="arrow" x1="268" y1="94" x2="286" y2="94"/><polygon class="head" points="294,94 284,88 284,100"/>
  <text class="who" x="48" y="144">技術の限界を、企画の強みに変えた</text>
  <rect class="box" x="20" y="174" width="520" height="168" rx="10"/><rect class="bar" x="20" y="174" width="10" height="168" rx="4"/><text class="step" x="48" y="206">2　自主制作も同じ</text>
  <text class="who" x="48" y="228">自分の限界</text>
  <rect class="chip" x="36" y="238" width="96" height="44" rx="8"/>
  <text class="ex" x="84" y="265" text-anchor="middle">時間</text>
  <rect class="chip" x="144" y="238" width="96" height="44" rx="8"/>
  <text class="ex" x="192" y="265" text-anchor="middle">人数</text>
  <rect class="chip" x="252" y="238" width="96" height="44" rx="8"/>
  <text class="ex" x="300" y="265" text-anchor="middle">技術</text>
  <line class="arrow" x1="358" y1="260" x2="384" y2="260"/><polygon class="head" points="392,260 382,254 382,266"/>
  <rect class="chip" x="396" y="238" width="128" height="44" rx="8"/>
  <text class="ex" x="460" y="255" text-anchor="middle">一番輝く</text>
  <text class="ex" x="460" y="275" text-anchor="middle">題材を選ぶ</text>
  <text class="who" x="48" y="322">限界は、企画を絞るための条件です</text>
  <rect class="box" x="20" y="354" width="520" height="160" rx="10"/><rect class="bar" x="20" y="354" width="10" height="160" rx="4"/><text class="step" x="48" y="386">3　限界が広がると、題材も広がる</text>
  <rect class="chip" x="36" y="402" width="228" height="74" rx="8"/>
  <text class="ex2" x="150" y="434" text-anchor="middle">『トイ・ストーリー』</text>
  <text class="ex" x="150" y="454" text-anchor="middle">おもちゃが主人公</text>
  <rect class="chip" x="296" y="402" width="228" height="74" rx="8"/>
  <text class="ex2" x="410" y="424" text-anchor="middle">約30年後の</text>
  <text class="ex" x="410" y="444" text-anchor="middle">『マイ・エレメント』</text>
  <text class="ex" x="410" y="464" text-anchor="middle">炎や水が主人公</text>
  <line class="arrow" x1="268" y1="439" x2="286" y2="439"/><polygon class="head" points="294,439 284,433 284,445"/>
  <text class="who" x="48" y="500">技術の限界が広がると、選べる題材も広がる</text>
</svg>
