    .fig-l52i .as{stroke:var(--c90,#C26A1B);stroke-width:2.5;fill:none}
    .fig-l52i .k{fill:var(--ink,#1A1D24)}
    .fig-l52i .ks{stroke:var(--ink,#1A1D24);stroke-width:2;fill:none}
    .fig-l52i .ss{stroke:var(--sub,#5B616E);stroke-width:1.5;fill:none}
    .fig-l52i .p{fill:var(--paper,#F4F5F7)}
    .fig-l52i .pn{fill:var(--panel,#FFFFFF)}
    .fig-l52i .d{stroke-dasharray:6 5}
  </style>
