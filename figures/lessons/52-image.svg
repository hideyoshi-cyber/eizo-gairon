<svg class="fig-l52i" viewBox="0 0 560 315" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="l52i-t l52i-d">
  <title id="l52i-t">アニメにカメラを持ち込む図案</title>
  <desc id="l52i-d">左は手描きの斜線、右はデジタルの格子。その境目に、同心円のレンズと、ぼけた光の円が重なる。アニメに実写のレンズの効果を持ち込むことを抽象的に表す。</desc>
