<svg class="fig-l50i" viewBox="0 0 560 315" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="l50i-t l50i-d">
  <title id="l50i-t">限界の中で輝く題材を表す図案</title>
  <desc id="l50i-d">つるつるした丸や角丸の面が左に並び、右の点線の境界の先には、ぎざぎざの線だけの形がある。技術の限界と、その中で選ぶ題材を抽象的に表す。</desc>
  <style>
    .fig-l50i .bg{fill:var(--panel,#FFFFFF)}
    .fig-l50i .gl{stroke:var(--rule,#D3D7DE);stroke-width:1;fill:none}
    .fig-l50i .a{fill:var(--c90,#C26A1B)}
    .fig-l50i .as{stroke:var(--c90,#C26A1B);stroke-width:2.5;fill:none}
    .fig-l50i .k{fill:var(--ink,#1A1D24)}
    .fig-l50i .ks{stroke:var(--ink,#1A1D24);stroke-width:2;fill:none}
    .fig-l50i .ss{stroke:var(--sub,#5B616E);stroke-width:1.5;fill:none}
    .fig-l50i .p{fill:var(--paper,#F4F5F7)}
    .fig-l50i .pn{fill:var(--panel,#FFFFFF)}
    .fig-l50i .d{stroke-dasharray:6 5}
  </style>
  <rect class="bg" width="560" height="315"/>
