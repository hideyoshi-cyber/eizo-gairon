<svg class="fig-l57d" viewBox="0 0 560 516" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="l57d-t l57d-d">
  <title id="l57d-t">迷うと悩むは違うの要点</title>
  <desc id="l57d-d">考察の3点。迷うのは選択肢を比べている状態、悩むのは止まっている状態。決めるとは他の案を捨てること。完璧を目指さず、今のベストを出す。</desc>
  <style>
    .fig-l57d .box{fill:var(--panel,#FFFFFF);stroke:var(--rule,#D3D7DE);stroke-width:1.5}
    .fig-l57d .bar{fill:var(--c90,#C26A1B)}
    .fig-l57d .step{fill:var(--ink,#1A1D24);font:700 19px "Zen Kaku Gothic New","Hiragino Sans",sans-serif}
    .fig-l57d .ex{fill:var(--ink,#1A1D24);font:500 14.5px "Zen Kaku Gothic New","Hiragino Sans",sans-serif}
    .fig-l57d .ex2{fill:var(--ink,#1A1D24);font:700 15px "Zen Kaku Gothic New","Hiragino Sans",sans-serif}
    .fig-l57d .who{fill:var(--sub,#5B616E);font:500 12.5px "Zen Kaku Gothic New","Hiragino Sans",sans-serif}
    .fig-l57d .sm{fill:var(--ink,#1A1D24);font:500 12.5px "Zen Kaku Gothic New","Hiragino Sans",sans-serif}
    .fig-l57d .chip{fill:var(--paper,#F4F5F7);stroke:var(--c90,#C26A1B);stroke-width:1.5}
    .fig-l57d .chipd{fill:none;stroke:var(--sub,#5B616E);stroke-width:1.5;stroke-dasharray:5 4}
    .fig-l57d .arrow{stroke:var(--c90,#C26A1B);stroke-width:3;fill:none}
    .fig-l57d .head{fill:var(--c90,#C26A1B)}
  </style>
  <rect class="box" x="20" y="16" width="520" height="200" rx="10"/><rect class="bar" x="20" y="16" width="10" height="200" rx="4"/><text class="step" x="48" y="48">1　迷うと悩むは違う</text>
  <rect class="chip" x="36" y="64" width="228" height="68" rx="8"/>
  <text class="ex2" x="150" y="93" text-anchor="middle">迷う</text>
  <text class="ex" x="150" y="113" text-anchor="middle">複数の選択肢を比べている</text>
  <rect class="chip" x="296" y="64" width="228" height="68" rx="8"/>
  <text class="ex2" x="410" y="83" text-anchor="middle">悩む</text>
  <text class="ex" x="410" y="103" text-anchor="middle">何をしていいか分からず</text>
  <text class="ex" x="410" y="123" text-anchor="middle">止まっている</text>
  <line class="arrow" x1="410" y1="132" x2="410" y2="138"/><polygon class="head" points="410,146 404,136 416,136"/>
  <rect class="chip" x="36" y="148" width="488" height="32" rx="8"/>
  <text class="ex" x="280" y="169" text-anchor="middle">止まったら、誰かに聞く。仮でもいいから手を動かす</text>
  <text class="who" x="48" y="200">迷いはクリエイティブの一部、悩みは止まっているだけ</text>
  <rect class="box" x="20" y="228" width="520" height="130" rx="10"/><rect class="bar" x="20" y="228" width="10" height="130" rx="4"/><text class="step" x="48" y="260">2　決めるとは、捨てること</text>
  <rect class="chip" x="36" y="276" width="228" height="44" rx="8"/>
  <text class="ex" x="150" y="293" text-anchor="middle">迷いの正体：</text>
  <text class="ex" x="150" y="313" text-anchor="middle">他の案を捨てる怖さ</text>
  <rect class="chip" x="296" y="276" width="228" height="44" rx="8"/>
  <text class="ex" x="410" y="303" text-anchor="middle">選ぶ＝他を捨てる</text>
  <line class="arrow" x1="268" y1="298" x2="286" y2="298"/><polygon class="head" points="294,298 284,292 284,304"/>
  <text class="who" x="48" y="340">その覚悟がないと、作品は完成しません</text>
  <rect class="box" x="20" y="370" width="520" height="130" rx="10"/><rect class="bar" x="20" y="370" width="10" height="130" rx="4"/><text class="step" x="48" y="402">3　今のベストを出す</text>
  <rect class="chip" x="36" y="418" width="208" height="44" rx="8"/>
  <text class="ex" x="140" y="435" text-anchor="middle">締め切りの中で</text>
  <text class="ex" x="140" y="455" text-anchor="middle">今のベストを出す</text>
  <text class="who" x="280" y="445" text-anchor="middle">ではなく</text>
  <rect class="chipd" x="316" y="418" width="208" height="44" rx="8"/>
  <text class="ex" x="420" y="435" text-anchor="middle">完璧を目指す</text>
  <text class="ex" x="420" y="455" text-anchor="middle">（終わらない）</text>
  <text class="who" x="48" y="482">完成させる経験が、次の作品の力になる</text>
</svg>
