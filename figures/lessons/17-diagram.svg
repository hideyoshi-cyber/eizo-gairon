<svg class="fig-l17d" viewBox="0 0 560 464" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="l17d-t l17d-d">
  <title id="l17d-t">本物を土台に、足りない部分をCGで補う</title>
  <desc id="l17d-d">本物を撮った土台の上に、足りないところだけをCGで足す。見せたいものを中心に置く。白黒でも成立する。</desc>
  <style>
    .fig-l17d .box{fill:var(--panel,#FFFFFF);stroke:var(--rule,#D3D7DE);stroke-width:1.5}
    .fig-l17d .dash{fill:none;stroke:var(--c10,#5C6BC0);stroke-width:2;stroke-dasharray:6 5}
    .fig-l17d .step{fill:var(--ink,#1A1D24);font:700 19px "Zen Kaku Gothic New","Hiragino Sans",sans-serif}
    .fig-l17d .sh{fill:var(--ink,#1A1D24);font:700 15px "Zen Kaku Gothic New","Hiragino Sans",sans-serif}
    .fig-l17d .ex{fill:var(--ink,#1A1D24);font:500 14.5px "Zen Kaku Gothic New","Hiragino Sans",sans-serif}
    .fig-l17d .who{fill:var(--sub,#5B616E);font:500 12.5px "Zen Kaku Gothic New","Hiragino Sans",sans-serif}
    .fig-l17d .arrow{stroke:var(--sub,#5B616E);stroke-width:3;fill:none}
    .fig-l17d .head{fill:var(--sub,#5B616E)}
    .fig-l17d .b1{fill:var(--c10,#5C6BC0)} .b2{fill:var(--c00,#B0347E)}
    .fig-l17d .chip{fill:var(--c10,#5C6BC0);fill-opacity:.12;stroke:var(--c10,#5C6BC0);stroke-width:1.5}
    .fig-l17d .chiph{fill:var(--c10,#5C6BC0)}
    .fig-l17d .chipt{fill:var(--ink,#1A1D24);font:700 14.5px "Zen Kaku Gothic New","Hiragino Sans",sans-serif;text-anchor:middle}
    .fig-l17d .chiptw{fill:var(--panel,#FFFFFF);font:700 14.5px "Zen Kaku Gothic New","Hiragino Sans",sans-serif;text-anchor:middle}
    .fig-l17d .axis{stroke:var(--ink,#1A1D24);stroke-width:2.5;fill:none}
    .fig-l17d .axh{fill:var(--ink,#1A1D24)}
    .fig-l17d .endl{fill:var(--ink,#1A1D24);font:700 14.5px "Zen Kaku Gothic New","Hiragino Sans",sans-serif}
    .fig-l17d .endr{fill:var(--ink,#1A1D24);font:700 14.5px "Zen Kaku Gothic New","Hiragino Sans",sans-serif;text-anchor:end}
    .fig-l17d .soft{fill:var(--c10,#5C6BC0);fill-opacity:.14;stroke:var(--c10,#5C6BC0);stroke-width:1.5}
    .fig-l17d .softh{fill:var(--c10,#5C6BC0);fill-opacity:.3;stroke:var(--c10,#5C6BC0);stroke-width:2}
  </style>
  <rect class="dash" x="20" y="16" width="520" height="70" rx="10"/>
  <text class="step" x="48" y="46">CG：足りない部分を補う</text>
  <text class="ex" x="48" y="70">空や背景、危険すぎる部分</text>
  <line class="arrow" x1="280" y1="98" x2="280" y2="110"/><polygon class="head" points="272,100 288,100 280,90"/>
  <rect class="box" x="20" y="114" width="520" height="92" rx="10"/>
  <rect class="b1" x="20" y="114" width="10" height="92" rx="4"/>
  <text class="step" x="48" y="144">本物：まず本物を撮る</text>
  <text class="ex" x="48" y="168">車も砂も爆発も本物</text>
  <text class="who" x="48" y="190">土台が本物だから、CGも本物に見える</text>
  <rect class="box" x="20" y="228" width="520" height="114" rx="10"/>
  <rect class="b2" x="20" y="228" width="10" height="114" rx="4"/>
  <text class="step" x="48" y="258">2　見せたいものを中心に</text>
  <text class="ex" x="48" y="282">カットが速いのに迷わない</text>
  <text class="ex" x="48" y="304">毎回ほぼ画面の中心に置く</text>
  <text class="who" x="48" y="326">速い編集と中心の構図はセット</text>
  <rect class="box" x="20" y="356" width="520" height="92" rx="10"/>
  <rect class="b1" x="20" y="356" width="10" height="92" rx="4"/>
  <text class="step" x="48" y="386">3　白黒版でも成立する</text>
  <text class="ex" x="48" y="410">色を抜いても成立する</text>
  <text class="ex" x="48" y="432">光と形がしっかり設計されている</text>
</svg>
