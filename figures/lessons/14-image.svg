<svg class="fig-l14i" viewBox="0 0 560 315" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="l14i-t l14i-d">
  <title id="l14i-t">炎と水が一つになる図案</title>
  <desc id="l14i-d">炎の形の中だけ波が濃くなり、外では薄く広がる。キャラクターとエフェクトの境界がなくなることを、波と形で表した。下に運河の格子を敷いた。</desc>
