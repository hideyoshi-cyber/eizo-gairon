<svg class="fig-l59d" viewBox="0 0 560 524" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="l59d-t l59d-d">
  <title id="l59d-t">波紋を読んで次の石を選ぶ要点</title>
  <desc id="l59d-d">考察の3点。他人の分析シートを受け取って、伝わり方を確かめる。伝わらなかったところが次の課題。波紋を読んで次の石を選ぶ。</desc>
  <style>
    .fig-l59d .box{fill:var(--panel,#FFFFFF);stroke:var(--rule,#D3D7DE);stroke-width:1.5}
    .fig-l59d .bar{fill:var(--c90,#C26A1B)}
    .fig-l59d .step{fill:var(--ink,#1A1D24);font:700 19px "Zen Kaku Gothic New","Hiragino Sans",sans-serif}
    .fig-l59d .ex{fill:var(--ink,#1A1D24);font:500 14.5px "Zen Kaku Gothic New","Hiragino Sans",sans-serif}
    .fig-l59d .ex2{fill:var(--ink,#1A1D24);font:700 15px "Zen Kaku Gothic New","Hiragino Sans",sans-serif}
    .fig-l59d .who{fill:var(--sub,#5B616E);font:500 12.5px "Zen Kaku Gothic New","Hiragino Sans",sans-serif}
    .fig-l59d .sm{fill:var(--ink,#1A1D24);font:500 12.5px "Zen Kaku Gothic New","Hiragino Sans",sans-serif}
    .fig-l59d .chip{fill:var(--paper,#F4F5F7);stroke:var(--c90,#C26A1B);stroke-width:1.5}
    .fig-l59d .chipd{fill:none;stroke:var(--sub,#5B616E);stroke-width:1.5;stroke-dasharray:5 4}
    .fig-l59d .arrow{stroke:var(--c90,#C26A1B);stroke-width:3;fill:none}
    .fig-l59d .head{fill:var(--c90,#C26A1B)}
  </style>
  <rect class="box" x="20" y="16" width="520" height="150" rx="10"/><rect class="bar" x="20" y="16" width="10" height="150" rx="4"/><text class="step" x="48" y="48">1　他人の分析シートを受け取る</text>
  <rect class="chip" x="36" y="64" width="228" height="60" rx="8"/>
  <text class="ex" x="150" y="89" text-anchor="middle">他の人が書いた</text>
  <text class="ex" x="150" y="109" text-anchor="middle">分析シート</text>
  <rect class="chip" x="296" y="64" width="228" height="60" rx="8"/>
  <text class="ex" x="410" y="89" text-anchor="middle">自分の作品の読まれ方</text>
  <text class="ex" x="410" y="109" text-anchor="middle">どの段まで伝わったか</text>
  <line class="arrow" x1="268" y1="94" x2="286" y2="94"/><polygon class="head" points="294,94 284,88 284,100"/>
  <text class="who" x="48" y="144">はしごの4段で、どこまで伝わっていたかを確かめる</text>
  <rect class="box" x="20" y="178" width="520" height="168" rx="10"/><rect class="bar" x="20" y="178" width="10" height="168" rx="4"/><text class="step" x="48" y="210">2　伝わらなかったところが次の課題</text>
  <rect class="chip" x="36" y="226" width="100" height="44" rx="8"/>
  <text class="ex" x="86" y="253" text-anchor="middle">抽象</text>
  <rect class="chip" x="165" y="226" width="100" height="44" rx="8"/>
  <text class="ex" x="215" y="253" text-anchor="middle">形容詞</text>
  <rect class="chip" x="294" y="226" width="100" height="44" rx="8"/>
  <text class="ex" x="344" y="253" text-anchor="middle">具体</text>
  <rect class="chip" x="423" y="226" width="100" height="44" rx="8"/>
  <text class="ex" x="473" y="253" text-anchor="middle">パラメータ</text>
  <line class="arrow" x1="138" y1="248" x2="155" y2="248"/><polygon class="head" points="163,248 153,242 153,254"/>
  <line class="arrow" x1="267" y1="248" x2="284" y2="248"/><polygon class="head" points="292,248 282,242 282,254"/>
  <line class="arrow" x1="396" y1="248" x2="413" y2="248"/><polygon class="head" points="421,248 411,242 411,254"/>
  <text class="who" x="48" y="298">伝わらなかった部分は、どこかの段を</text>
  <text class="who" x="48" y="316">飛ばしていた可能性がある</text>
  <rect class="box" x="20" y="358" width="520" height="150" rx="10"/><rect class="bar" x="20" y="358" width="10" height="150" rx="4"/><text class="step" x="48" y="390">3　次の石を選ぶ</text>
  <rect class="chip" x="36" y="406" width="140" height="60" rx="8"/>
  <text class="ex" x="106" y="431" text-anchor="middle">今回の波紋を</text>
  <text class="ex" x="106" y="451" text-anchor="middle">読む</text>
  <rect class="chip" x="210" y="406" width="140" height="60" rx="8"/>
  <text class="ex" x="280" y="431" text-anchor="middle">次に何を作るかの</text>
  <text class="ex" x="280" y="451" text-anchor="middle">芯を決める</text>
  <rect class="chip" x="384" y="406" width="140" height="60" rx="8"/>
  <text class="ex" x="454" y="431" text-anchor="middle">3年生の卒業制作</text>
  <text class="ex" x="454" y="451" text-anchor="middle">大きな石を投げる</text>
  <line class="arrow" x1="178" y1="436" x2="200" y2="436"/><polygon class="head" points="208,436 198,430 198,442"/>
  <line class="arrow" x1="352" y1="436" x2="374" y2="436"/><polygon class="head" points="382,436 372,430 372,442"/>
  <text class="who" x="48" y="486">次の石は、今回よりも大きくなる</text>
</svg>
